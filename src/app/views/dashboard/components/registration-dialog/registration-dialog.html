<h2 mat-dialog-title>
  {{ dialogTitle() }}
</h2>

<mat-dialog-content class="dialog-content-wrapper">
  <!-- Progress Bar -->
  <div class="progress-container">
    <mat-progress-bar 
      mode="determinate" 
      [value]="stepProgress()">
    </mat-progress-bar>
    <span class="step-indicator">
      Paso {{ currentStep() + 1 }} de {{ totalSteps() }}
    </span>
  </div>

  <mat-stepper linear #stepper [selectedIndex]="currentStep()" (selectionChange)="onStepChange($event.selectedIndex)">
    <!-- Step 1: Datos Generales -->
    <mat-step [stepControl]="step1Group">
      <ng-template matStepLabel>Datos Generales</ng-template>
      <form [formGroup]="step1Group" autocomplete="off">
        <app-client-data-step
          [formGroup]="step1Group"
          [isEditMode]="isEditMode()"
          [logoFile]="logoFile()"
          [logoPreview]="logoPreview() || logoUrl()"
          [isUploadingLogo]="isUploadingLogo()"
          [planOptions$]="planOptions$"
          (logoSelected)="onLogoSelected($event)"
          (logoRemoved)="onLogoRemoved()">
        </app-client-data-step>
      </form>
    </mat-step>

    <!-- Step 2: Restaurante Matriz -->
    <mat-step [stepControl]="step2Group">
      <ng-template matStepLabel>Restaurante Matriz</ng-template>
      <form [formGroup]="step2Group" autocomplete="off">
        <app-restaurant-data-step
          [formGroup]="step2Group"
          [isEditMode]="isEditMode()"
          [planOptions$]="planOptions$"
          [stateOptions$]="stateOptions$"
          [municipalityOptions$]="municipalityOptions$"
          [neighborhoodOptions$]="neighborhoodOptions$"
          (stateSelected)="onStateSelected($event)"
          (municipalitySelected)="onMunicipalitySelected($event)"
          (neighborhoodSelected)="onNeighborhoodSelected($event)">
        </app-restaurant-data-step>
      </form>
    </mat-step>

    <!-- Step 3: Documentos -->
    <mat-step [stepControl]="step3Group">
      <ng-template matStepLabel>Documentos</ng-template>
      <form [formGroup]="step3Group" autocomplete="off">
        <app-documents-step
          [formGroup]="step3Group"
          [personType]="personType()"
          [uploadedFiles]="uploadedFiles()"
          (fileSelected)="onFileSelected($event)">
        </app-documents-step>
      </form>
    </mat-step>
  </mat-stepper>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="onCancel()">Cancelar</button>

  @if (!isFirstStep()) {
    <button 
      mat-button 
      (click)="goToPreviousStep()" 
      [disabled]="isSaving()">
      Anterior
    </button>
  }

  <button 
    mat-flat-button 
    color="primary" 
    (click)="handleStepAction()"
    [disabled]="!canGoNext() || isSaving()">
    @if (isSaving()) {
      <mat-spinner diameter="20" class="button-spinner"></mat-spinner>
      <span class="ms-2">
        {{ savingStep() !== null ? 'Guardando...' : 'Procesando...' }}
      </span>
    } @else {
      {{ buttonLabel() }}
    }
  </button>
</mat-dialog-actions>
