<header class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="page-title">Clientes Registrados</h1>
  <div class="actions d-flex align-items-center gap-3">
    <mat-form-field appearance="outline" class="search-bar pt-3">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput placeholder="Buscar por Cliente, Razón Social o RFC..." (keyup)="onSearch($event)">
    </mat-form-field>
    <button mat-flat-button color="primary" class="action-button" (click)="startOnboarding()">
      <mat-icon>add</mat-icon>
      Registrar Cliente
    </button>
  </div>
</header>

<div class="table-container bg-white rounded-3 shadow-sm overflow-hidden">
  <table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef> Cliente </th>
      <td mat-cell *matCellDef="let client" class="py-3">
        <div class="fw-semibold">{{client.fullName}}</div>
        <div class="small text-muted">
          <span class="fw-medium">RFC:</span> {{client.rfc}}
        </div>
        <div class="small text-muted">
          {{ client.customerType == 'PERSONA_FISICA' ? 'Persona Física' : 'Persona Moral' }}
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="contacto">
      <th mat-header-cell *matHeaderCellDef> Contacto </th>
      <td mat-cell *matCellDef="let client">
        <div>{{client.email}}</div>
        <div class="text-muted small">{{client.phone}}</div>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let client">
        <mat-chip-option
          [color]="client.status === 'ACTIVE' ? 'primary' : (client.status === 'PENDING' ? 'accent' : 'warn')" selected
          disabled>
          {{ client.status }}
        </mat-chip-option>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-end"> Acciones </th>
      <td mat-cell *matCellDef="let client" class="text-end action-cell">
        <button mat-icon-button (click)="editClient(client)" matTooltip="Editar registro">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" [colSpan]="displayedColumns.length">
        No se encontraron clientes que coincidan con la búsqueda.
      </td>
    </tr>
  </table>

  <mat-paginator class="p-2" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
    aria-label="Selecciona página de clientes">
  </mat-paginator>
</div>
