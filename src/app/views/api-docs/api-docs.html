<div class="api-docs container py-3">
  <div class="row mb-3">
    <div class="col-12 text-center">
      <h2 class="h4 m-0">API Docs de Microservicios</h2>
    </div>
  </div>

  <div class="row g-3">
    @for (s of services; track s.name) {
    <div class="col-12 col-sm-6 col-lg-4 col-xxl-3 d-flex">
      <mat-card class="card flex-fill text-start" tabindex="0" (click)="openDocs(s.docUrl)">
        <mat-card-header>
          <mat-card-title>{{ s.label }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <p class="text-muted small m-0">{{ s.docUrl }}</p>
        </mat-card-content>
      </mat-card>
    </div>
    }
  </div>
</div>
