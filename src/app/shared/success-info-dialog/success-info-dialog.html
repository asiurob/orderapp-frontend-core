<div class="success-header">
  <mat-icon class="success-icon">check_circle</mat-icon>
  <h2 mat-dialog-title>¡Restaurante Creado Exitosamente!</h2>
</div>

<mat-dialog-content>
  <p class="text-muted">
    El restaurante ha sido registrado. Estos son los datos de acceso para el dueño.
    <br><strong>¡Guárdalos en un lugar seguro!</strong>
  </p>
  
  <div class="info-container">
    <div class="info-item">
      <span class="info-label">URL del Workspace:</span>
      <span class="info-value">
        <a [href]="data.workspaceUrl" target="_blank">{{ data.workspaceUrl }}</a>
      </span>
    </div>
    
    <div class="info-item">
      <span class="info-label">Usuario (Username):</span>
      <span class="info-value code">{{ data.username }}</span>
      <button mat-icon-button (click)="copyToClipboard(data.username)" matTooltip="Copiar">
        <mat-icon>content_copy</mat-icon>
      </button>
    </div>

    <div class="info-item">
      <span class="info-label">Contraseña Temporal:</span>
      <span class="info-value code">{{ data.temporaryPassword }}</span>
      <button mat-icon-button (click)="copyToClipboard(data.temporaryPassword)" matTooltip="Copiar">
        <mat-icon>content_copy</mat-icon>
      </button>
    </div>
  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" [mat-dialog-close]="true" cdkFocusInitial>
    Entendido
  </button>
</mat-dialog-actions>
