<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button [mat-dialog-close]="false">
    {{ data.cancelText }}
  </button>
  
  <button 
    mat-flat-button 
    [color]="data.confirmColor" 
    [mat-dialog-close]="true"
    cdkFocusInitial>
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
